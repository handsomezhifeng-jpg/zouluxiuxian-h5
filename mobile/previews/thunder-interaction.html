<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>境界雷劫 · 交互预览</title><link rel="stylesheet" href="../portrait.css"><link rel="stylesheet" href="../moon-ui.css"><link rel="stylesheet" href="../moon-actions.css"><link rel="stylesheet" href="../thunder-view.css"><style>:root{--u:calc(min(100vw,750px)/375)}body{margin:0;background:#081a2a}.app-shell{height:100dvh;width:min(100vw,750px);margin:auto;display:flex;flex-direction:column}#screen{display:flex;flex:1;min-height:0}.preview-nav{height:calc(62 * var(--u));display:flex;align-items:center;justify-content:space-around;background:#102d43;color:#d2e5f0;font:calc(13 * var(--u)) KaiTi,serif}.preview-nav span:nth-child(2){color:#9ce4ff}.preview-note{position:absolute;right:8px;top:2px;color:#91a8b7;font:10px sans-serif;z-index:5}</style><div class="app-shell"><small class="preview-note">交互预览 · 不修改存档</small><main id="screen" class="game-screen"></main><nav class="preview-nav"><span>修炼</span><span>境界</span><span>人物</span><span>历练</span><span>纳戒</span><span>功法</span><span>设置</span></nav></div><script src="../thunder-model.js"></script><script src="../thunder-view.js"></script><script>
const r={currentName:'炼气一境',nextName:'炼气二境',qi:1000,maxQi:1000,defense:76,canAct:true,active:false,thunder:{nextTotal:3,nextDamage:90,total:3,strikes:0}};const s={playerName:'云无尘',stats:{age:18,lifespan:130},tribulation:r};let timer;const draw=()=>document.getElementById('screen').innerHTML=MobileThunderView.render(s,{});draw();document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='realm-start'){r.active=true;r.qi=1000;r.thunder={nextTotal:3,total:3,strikes:0};draw();timer=setInterval(()=>{const t=r.thunder,damage=MobileThunderRules.damage(180,r.defense,t.strikes,t.total);r.qi=Math.max(0,r.qi-damage);t.last={damage};t.strikes++;if(r.qi<=0||t.strikes===t.total){r.active=false;t.result=r.qi>0?'success':'failed';if(r.qi>0)r.currentName='炼气二境';clearInterval(timer);}draw();},1400);}else if(a==='realm-stop'){clearInterval(timer);r.active=false;r.thunder.result='stopped';draw();}});
</script></html>
