<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>境界装备 · 64件图鉴</title><link rel="stylesheet" href="../../equipment-atlas.css"><script src="../../equipment-atlas.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4eee1;color:#55442b;font:16px KaiTi,'Microsoft YaHei',serif;padding:30px}main,header{max-width:1150px;margin:auto}h1{margin:0 0 10px}header p{color:#8a775a;line-height:1.8}nav{display:flex;gap:12px;margin:18px 0}a,select{color:#786039;padding:9px;border:1px solid #c9b68e;border-radius:5px;background:#fcf8ed}article{display:grid;grid-template-columns:150px repeat(4,1fr);align-items:center;border-top:1px solid #d6c8a8;padding:20px 0;gap:18px}h2{font-size:23px}small{display:block;font:13px/1.6 'Microsoft YaHei',sans-serif;color:#9b8b70}figure{margin:0;text-align:center}.tile{width:min(100%,150px);aspect-ratio:1;background:#fffaf0;border:1px solid #d2bc8c;border-radius:10px;margin:0 auto 9px}.equipment-sprite{width:100%;height:100%}figcaption{line-height:1.8}#character{display:none}#character.active{display:block;max-width:750px;margin:auto}#catalog.hidden{display:none}@media(max-width:650px){body{padding:16px}article{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}article>div{grid-column:1/-1;display:flex;align-items:center;gap:15px}article h2{margin:0 0 10px}.tile{border-radius:5px}figcaption{font-size:13px}small{font-size:10px}}</style><header><h1>境界装备 · 64件图鉴</h1><p>B版玉雕描边风格 · 16个大境界 · 四类装备。由一张透明图集按坐标显示。<br>从竹木素钢到仙金圣晶，逐境进阶。</p><nav><a href="../../assets/equipment/equipment-atlas.png" target="_blank">打开完整图集</a></nav></header><main id="catalog"></main><script>const A=window.MobileEquipmentAtlas;document.querySelector('#catalog').innerHTML=A.realms.map(r=>`<article><div><h2>${r.realm}</h2><small>${r.design}</small></div>${r.items.map(i=>`<figure><div class="tile">${A.icon(i)}</div><figcaption>${i.name}<small>${i.label}</small></figcaption></figure>`).join('')}</article>`).join('');</script></html>
