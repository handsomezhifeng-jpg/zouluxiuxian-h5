<style>
*{box-sizing:border-box}body{margin:0;background:#ded8c9;color:#493925;font:18px/1.5 KaiTi,STKaiti,serif}h1{text-align:center;font-size:26px;font-weight:400;margin:15px}main{display:flex;gap:22px;padding:0 20px 25px;min-width:1120px;max-width:1440px;margin:auto}article{flex:1;min-width:0}article>h2{text-align:center;font-size:22px;font-weight:400;margin:6px 0 12px}body[data-ui-theme="silk"] .equipment-detail.artifact-detail{position:relative;display:block;width:100%;margin:0;--c-u:calc((100vw - 84px) / 3 / 877);--canvas-height:1318;--cut:100;aspect-ratio:877/1318;max-height:none;isolation:isolate}.artifact-detail .artifact-star-row{left:18%;right:18%;height:calc(52 * var(--c-u));top:calc(663 * var(--c-u));gap:1.3%}.artifact-detail .artifact-star-row i{width:12%;max-width:calc(58 * var(--c-u));background-image:var(--star-art);filter:drop-shadow(0 1px 1px #24150ce0)}.artifact-detail .artifact-detail-header h2{font-size:clamp(20px,6.6cqw,36px)}.artifact-detail .artifact-stat-icon{min-width:0}.artifact-detail .artifact-affixes p{font-size:clamp(12px,3.3cqw,20px)}.artifact-detail .artifact-affixes strong{font-size:clamp(14px,4cqw,24px)}
