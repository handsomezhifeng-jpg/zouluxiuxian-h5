        <button class="chip" type="button" data-crop="sidebar" aria-pressed="false">人物侧栏</button>

        <button type="button" data-shift="up" aria-label="向上查看">↑</button>
        <button type="button" data-shift="down" aria-label="向下查看">↓</button>
        <button type="button" data-shift="right" aria-label="向右查看">→</button>
        <button type="button" data-zoom="out" aria-label="缩小界面">−</button>
        <button type="button" data-zoom="in" aria-label="放大界面">＋</button>
      </div>

      </div>
    </section>

      <h2 id="menuTitle">设置与功能</h2>
      <fieldset class="audio-settings"><legend>声音</legend>

        <label>音效音量<input type="range" min="0" max="100" data-audio-pref="effectsVolume" aria-label="音效音量"></label>

        <button class="secondary-button" data-action="navigate" data-route="spirits">洞府灵阵</button>
        <button class="secondary-button" data-action="navigate" data-route="expedition">秘境探索</button>

        <button class="secondary-button" data-action="full-game">展开完整游戏界面</button>
        <button class="secondary-button" data-action="back-cultivation">返回修炼</button>
        <button class="secondary-button" data-action="close-menu">收起设置</button>
