<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>任务卷轴图标三选</title><style>
*{box-sizing:border-box}body{margin:0;background:#10263b;color:#d9eaf5;font-family:'Microsoft YaHei',sans-serif;padding:36px}h1{font-size:23px;font-weight:500;margin:0 0 32px}main{display:flex;gap:20px}.card{width:240px;text-align:center;padding:28px 20px;background:#193349;border:1px solid #63829840;border-radius:12px}.large{width:88px;height:88px;margin:8px auto 30px;color:#d8e8f4}.large svg{width:100%;height:100%}h2{font-size:18px;font-weight:400;margin:0 0 24px}.actual{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;border-top:1px solid #7c9aae33;padding-top:22px}.actual svg{width:21px;height:21px;flex-shrink:0}small{display:block;color:#9fb8cd;font-size:12px;margin-top:14px}footer{color:#9fb8cd;font-size:13px;margin-top:28px}
</style><h1>主线任务 · 卷轴图标</h1><main id="choices"></main><footer>统一 24 × 24 画布、1.5 描边；下方为游戏内 21px 显示效果。</footer><script>
const designs=[['A · 展开卷轴','<rect x="4" y="2.5" width="16" height="4" rx="2"/><rect x="4" y="17.5" width="16" height="4" rx="2"/><path d="M6 6.5v11m12-11v11M9 10h6m-6 3.5h6"/>'],['B · 斜置卷轴','<g transform="rotate(24 12 12)"><path d="M7 4h10v15H7z"/><rect x="5" y="2.5" width="14" height="4" rx="2"/><rect x="5" y="17.5" width="14" height="4" rx="2"/><path d="M9.5 10h5m-5 3h4"/></g>'],['C · 任务卷轴','<path d="M6 5v13m12-13v13"/><rect x="4" y="2.5" width="16" height="4" rx="2"/><rect x="4" y="17.5" width="16" height="4" rx="2"/><path d="m8.5 11.5 2.5 2.5 4.5-4.5"/>']];
const svg=p=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
document.querySelector('main').innerHTML=designs.map(([name,p])=>`<article class="card"><div class="large">${svg(p)}</div><h2>${name}</h2><div class="actual">${svg(p)}<span>主线 · 吐纳修炼</span></div><small>实际尺寸</small></article>`).join('');
</script></html>
