<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>水墨战斗 · 三版交互预览</title><link rel="stylesheet" href="combat-three.css"></head>
<body><div class="phone" data-variant="a"><div class="design-bar"><span>战斗界面提案 <small>示例数据</small></span><nav aria-label="切换设计方案"><a href="?v=a" data-design="a">一 · 水墨</a><a href="?v=b" data-design="b">二 · 融合</a><a href="?v=c" data-design="c">三 · 沉浸</a></nav></div>
<div class="game"><header class="role-bar"><div class="portrait"></div><div class="role-copy"><span class="role-kicker">散修 · 云游四方</span><strong>炼气二境</strong><small>攻击 245　防御 122</small></div><div class="role-right"><span>灵石 <b id="coins">3,500</b></span><small>寿元 26 / 161 年</small></div></header>
<section class="chapter"><div class="chapter-copy"><span class="chapter-eyebrow">凡界 · 第一程</span><h1>青山驿道</h1><p>山深林密，妖兽盘踞，过往行人难以通行。</p></div><div class="objective"><span>主线 · 初战野猪</span><b><span id="kills">2</span> / 5</b><div class="objective-track"><i id="questFill"></i></div></div></section>
<section class="arena" aria-label="战斗演示，点击场景试招" tabindex="0"><div class="mountains"></div><div class="sun"></div><div class="mist mist-one"></div><div class="mist mist-two"></div><div class="ground"></div>
<div class="arena-top"><div class="player-meter"><div><span>自身气血</span><b id="playerLabel">7,976 / 7,976</b></div><div class="meter"><i id="playerFill"></i></div></div><div class="opponent"><div class="opponent-line"><strong id="enemyName">乌鬃野猪</strong><button id="switchTarget" class="switch">切换 ⇄</button></div><small>凡阶 · 未进化</small><div class="meter enemy-meter"><i id="enemyFill"></i></div><b id="enemyLabel">100.0%</b></div></div>
<div class="actor fighter" id="fighter" aria-label="持剑修士"><div class="sprite"></div></div><div class="actor monster" id="monster" aria-label="乌鬃野猪"><div class="sprite"></div></div><div class="slash" id="slash"></div><div class="impact" id="impact"></div><div id="floatLayer" class="float-layer"></div><div class="battle-receipt" id="receipt" hidden></div><div class="scene-caption"><span class="state-dot"></span><span id="battleState">自动历练中</span><small id="cadence">突进 · 挥斩 · 受击</small></div></section>
<section class="battle-info"><div><small>当前目标</small><strong>凡核 · 兽魂</strong></div><div><small>进化进度</small><strong id="evolution">2 / 100</strong></div><button id="details">妖兽详情 ›</button></section>
<section class="journal"><div class="journal-title"><h2>历练见闻</h2><button id="allLogs">全部记录 ›</button></div><div id="logs"><p><time>片刻前</time><span>发现乌鬃野猪，踏入青山驿道。</span></p><p><time>片刻前</time><span>初战野猪，主线进度 <b>2 / 5</b>。</span></p></div></section>
<div class="controls"><button class="try" id="tryAttack"><span>剑</span>试演一招</button><button id="autoBattle" class="auto is-running"><span class="auto-icon">⚔</span><span id="autoLabel">暂停历练</span></button><button class="speed" id="speed"><b id="speedLabel">1×</b>战斗速度</button></div>
<nav class="bottom-nav"><button><i>☼</i>修炼</button><button><i>♧</i>境界</button><button><i>♙</i>人物</button><button class="selected"><i>⚔</i>历练</button><button><i>♢</i>纳戒</button><button><i>▤</i>功法</button><button id="settings"><i>⚙</i>设置</button></nav>
</div></div><div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header><h2 id="sheetTitle"></h2><button id="closeSheet">收起</button></header><div id="sheetBody"></div></section></div><script src="combat-three.js"></script></body></html>
