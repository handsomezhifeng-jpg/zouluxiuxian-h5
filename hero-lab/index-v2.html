<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主角战斗形象 · 试演台</title><link rel="stylesheet" href="lab.css"><body><main><header><div><small>修真家族 · 角色试演</small><h1>一招一式，选你的主角</h1><p>白衣蓝襟，统一修炼形象。简化服装、清晰描边，比较三种大幅度动作。</p></div><a href="/">返回游戏 ↗</a></header><section class="options" aria-label="角色方案"></section><section class="readability"><img src="../mobile/assets/cultivation-quiet-v3.png" alt="修炼角色着装参考"><div><strong>着装锚点</strong><span>黑发白束带 · 白色外袍 · 浅蓝交领 · 深蓝腰封 · 深色护腕</span><small>三版保持同一人物，只比较剪影与动作。外描边随画面渲染，保证缩小后的识别度。</small></div></section><section class="workspace"><div class="stage"><div class="stage-top"><span>青石山道 · 动作模拟</span><span id="state">待机</span></div><canvas id="battle" aria-label="战斗角色动作预览"></canvas><div class="stage-bottom"><span id="caption">A · 霜衣剑修</span><span>独立模拟 · 不读写游戏存档</span></div></div><aside><small>试演控制</small><h2 id="title">霜衣剑修</h2><p id="description"></p><div class="scale-check"><canvas width="90" height="130" data-mini="64"></canvas><canvas width="100" height="130" data-mini="80"></canvas><canvas width="115" height="130" data-mini="108"></canvas></div><div class="actions" aria-label="动作切换"></div><label>播放速度 <output id="speedText">1.0×</output><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"></label><label>角色高度 <output id="sizeText">108 px</output><input id="size" type="range" min="64" max="180" value="108"></label><label>接触时刻 <output id="contactText">50%</output><input id="contact" type="range" min="25" max="75" value="50"></label><label>动作进度 <output id="scrubText">0%</output><input id="scrub" type="range" min="0" max="99" value="0"></label><div class="row"><button id="pause">暂停</button><button id="flip">朝向 ↔</button><button id="reset">重置</button></div><label class="check"><input type="checkbox" id="grid" checked>显示格位</label><label class="check"><input type="checkbox" id="ghost" checked>显示敌方比例参照</label><button class="choose" id="choose">选
