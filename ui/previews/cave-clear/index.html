<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洞府 · 清晰建筑与拖屏大地图</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e3d8;color:#59472c;font-family:KaiTi,'Microsoft YaHei',serif;padding:26px}header,main{max-width:1500px;margin:auto}header h1{margin:0 0 10px;font-size:28px}header p{color:#927e5d;line-height:1.7;margin:0 0 26px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}article{min-width:0}h2{font-size:23px;margin:0 0 8px}article>p{font-size:14px;line-height:1.6;color:#927d5a;margin:0 0 13px;min-height:45px}.phone{position:relative;aspect-ratio:390/800;overflow:hidden;border-radius:10px;box-shadow:0 10px 28px #69533220;background:#f8f2e7;display:flex;flex-direction:column}.viewport{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;background:#f7f3e8}.viewport.dragging{cursor:grabbing}.world{position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none;transform-origin:0 0;will-change:transform}.top-ui{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:start;justify-content:space-between;pointer-events:none;color:#54482f;text-shadow:0 1px 3px #fff,0 0 5px #fff}.top-ui strong{font-size:22px;font-weight:500}.top-ui small{font-size:11px;line-height:1.7;text-align:right}.actions{position:absolute;bottom:18px;right:12px;display:flex;flex-direction:column;gap:12px;pointer-events:none}.actions span{width:43px;height:43px;display:grid;place-items:center;border-radius:50%;border:1px solid #bba16c;background:#fff8e9e6;color:#816436;font-size:13px;box-shadow:0 1px 6px #7b63351a}.zoom{position:absolute;left:12px;bottom:16px;display:flex;gap:6px}.zoom button{background:#fff9edc9;color:#8c744a;border:1px solid #c4b28a;border-radius:50%;width:30px;height:30px;font:18px KaiTi,serif}.hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:10px;color:#776c53;text-shadow:0 1px 4px #fff;white-space:nowrap;pointer-events:none}.preview-nav{position:relative;flex:none;aspect-ratio:1044/172;background:linear-gradient(#f8f1e4,#fdf9f1 50%,#f8f1e4);display:grid;grid-template-columns:repeat(6,1fr);padding:0 1.5%;isolation:isolate}.preview-nav::before{content:'';position:absolute;inset:0;background:url('../../assets/navigation-a-neutral.png') center/100% 100%;mask-image:linear-gradient(to right,#000 66.16%,transparent 66.16%,transparent 82.33%,#000 82.33%),linear-gradient(to bottom,#000 7%,transparent 7%,transparent 94%,#000 94%);z-index:-1}.preview-nav span{position:relative}.preview-nav .cave img{position:absolute;top:12%;left:19%;width:62%;height:58%;object-fit:contain;border-radius:50%;outline:1px solid #bd9e58;filter:drop-shadow(0 0 4px #d5ad5c66)}.preview-nav .cave b{position:absolute;top:72%;left:0;right:0;text-align:center;color:#98752e;font-size:clamp(12px,1.4vw,19px);font-weight:500;line-height:1.1}article>a{display:block;margin-top:12px;font-size:14px;color:#8e7449}a:focus-visible,button:focus-visible{outline:2px solid #a18349;outline-offset:3px}body.solo main{display:block;max-width:750px}body.solo article{display:none}body.solo article.chosen{display:block}body.solo article>h2,body.solo article>p{display:none}body.solo .phone{aspect-ratio:9/16}body.solo .preview-nav .cave b{font-size:clamp(12px,3.5vw,27px)}@media(max-width:760px){body{padding:18px}main{grid-template-columns:1fr;gap:35px}article>p{min-height:0}.preview-nav .cave b{font-size:3.5vw}.phone{max-width:500px;margin:auto}body.solo{padding:0}body.solo header{padding:15px}body.solo header p{display:none}body.solo header h1{font-size:18px;margin:0}body.solo .phone{border-radius:0;max-width:none}}</style><header><h1>洞府 · 建筑更清楚，场景更疏朗</h1><p>大体块建筑、减少碎纹理、设施之间留出庭院和空地。每张都是超出一屏的大地图。<br>在下方场景内拖动查看，可点击＋／－调整远近；图片仅为视觉预览，未替换实际游戏。</p></header><main id="previews"></main><script>
const versions=[['A','清溪疏庭','开阔河谷与大庭院，建筑最清楚、留白最多。','A-valley.png'],['B','青山台院','低台地分区，建筑体块明确，山势和空间层次更强。','B-terraces.png'],['C','玉阙园府','完整庭园式洞府，轮廓简洁，材质和建筑辨识度更统一。','C-courtyards.png']];
const chosen=new URLSearchParams(location.search).get('view');if(chosen)document.body.classList.add('solo');
document.querySelector('#previews').innerHTML=versions.map(([id,name,description,file])=>`<article class="${chosen===id?'chosen':''}"><h2>${id} · ${name}</h2><p>${description}</p><div class="phone"><div class="viewport"><img class="world" src="${file}" alt="${name}可拖动洞府大地图" draggable="false"><div class="top-ui"><strong>云归洞府</strong><small>灵石 1280　灵木 360<br>弟子 12/20</small></div><div class="actions" aria-hidden="true"><span>营造</span><span>弟子</span><span>府库</span></div><div class="zoom"><button data-zoom="1.2" aria-label="放大">＋</button><button data-zoom="0.833333" aria-label="缩小">－</button></div><span class="hint">拖动画面探索洞府</span></div><nav class="preview-nav" aria-label="底部功能栏"><span aria-label="修炼"></span><span aria-label="人物"></span><span aria-label="历练"></span><span aria-label="纳戒"></span><span class="cave" aria-label="洞府"><img src="../../assets/nav-a-adventure.png" alt=""><b>洞府</b></span><span aria-label="设置"></span></nav></div><a href="?view=${id}">单独查看此版拖屏效果</a> · <a href="${file}" target="_blank">查看完整大地图</a></article>`).join('');
for(const viewport of document.querySelectorAll('.viewport')){const image=viewport.querySelector('.world');let x=0,y=0,scale=3.2,w=0,h=0,start=null,initialized=false;function paint(){w=viewport.clientWidth*scale;h=w*image.naturalHeight/image.naturalWidth;image.style.width=w+'px';x=Math.min(0,Math.max(Math.min(0,viewport.clientWidth-w),x));y=Math.min(0,Math.max(Math.min(0,viewport.clientHeight-h),y));image.style.transform=`translate(${x}px,${y}px)`;viewport.dataset.camera=JSON.stringify({x,y,scale});}function init(){if(!image.naturalWidth||!viewport.clientWidth)return;w=viewport.clientWidth*scale;h=w*image.naturalHeight/image.naturalWidth;if(!initialized){x=(viewport.clientWidth-w)/2;y=(viewport.clientHeight-h)/2;initialized=true;}paint();}image.onload=init;if(image.complete)init();new ResizeObserver(init).observe(viewport);viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;start={pointer:e.pointerId,px:e.clientX,py:e.clientY,x,y};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');});viewport.addEventListener('pointermove',e=>{if(!start||e.pointerId!==start.pointer)return;x=start.x+e.clientX-start.px;y=start.y+e.clientY-start.py;paint();});for(const event of ['pointerup','pointercancel','lostpointercapture'])viewport.addEventListener(event,()=>{start=null;viewport.classList.remove('dragging');});viewport.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{const previous=scale;scale=Math.min(5,Math.max(1.4,scale*Number(b.dataset.zoom)));x=viewport.clientWidth/2-(viewport.clientWidth/2-x)*scale/previous;y=viewport.clientHeight/2-(viewport.clientHeight/2-y)*scale/previous;paint();});}
</script></html>
