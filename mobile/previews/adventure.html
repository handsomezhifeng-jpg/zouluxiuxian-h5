<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>历练 · 合并界面预览</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#113c32;color:#183c33;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:13px}.phone{max-width:750px;height:100dvh;margin:auto;background:#f7f1e1;display:flex;flex-direction:column;--u:min(.2666667vw,2px);font-size:calc(12 * var(--u))}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #c58f2e;outline-offset:2px}.top{background:linear-gradient(90deg,#003d30,#00392fe0),url('../assets/ink-mountains.webp') center/cover;color:#f7efd3;border:2px solid #d2b261;border-radius:9px;margin:calc(4 * var(--u));padding:calc(8 * var(--u)) calc(10 * var(--u))}.identity{display:flex;gap:calc(10 * var(--u));align-items:center}.avatar{height:calc(43 * var(--u));width:calc(43 * var(--u));border-radius:50%;border:1px solid #d8bf78;background:url('../assets/cultivator.webp') center/cover}.realm{font-family:KaiTi,serif;font-size:calc(20 * var(--u));flex:1}.realm small{display:block;font:calc(10 * var(--u)) sans-serif;color:#d2c693;margin-top:4px}.preview-tag{font-size:calc(9 * var(--u));border:1px solid #d9bf6c80;color:#e2cf98;padding:4px 6px;border-radius:4px}.stats{display:flex;justify-content:space-between;margin-top:calc(7 * var(--u));font-size:calc(10 * var(--u));color:#dedfc3}.stats b{color:#fff6dd;font-weight:500}.quest{margin:0 calc(5 * var(--u));padding:calc(6 * var(--u)) calc(10 * var(--u));background:#004334;color:#f1da96;border:1px solid #bda05b;border-radius:5px;display:flex;justify-content:space-between;font-size:calc(12 * var(--u))}.main{display:flex;flex:1;min-height:0;flex-direction:column;padding:calc(6 * var(--u));gap:calc(6 * var(--u))}.regions{display:flex;align-items:center;gap:calc(5 * var(--u));flex-shrink:0}.region{flex:1;border:1px solid #c8b88d;border-radius:4px;background:#eae5d4;color:#768070;padding:calc(5 * var(--u));font-size:calc(11 * var(--u))}.region.active{background:#124e40;color:#f6df99;border-color:#b79b54}.region.locked{color:#9 }.fight.running{background:linear-gradient(90deg,#655b35,#3b482f)}.target-panel{min-height:0;display:flex;flex-direction:column;flex:1}.targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(5 * var(--u));min-height:0;overflow:auto;scrollbar-width:thin}.target{position:relative;min-width:0;padding:calc(6 * var(--u)) calc(4 * var(--u));border:1px solid #d7c9a5;border-radius:5px;background:#f3efdf;text-align:center;color:#234d3f}.target.selected{border:1.5px solid #a58837;background:#e2e8d5;box-shadow:inset 0 0 0 2px #f9e9b5}.target.selected:after{content:'✓';position:absolute;right:3px;top:1px;color:#8e762a;font-size:calc(9 * var(--u))}.target strong{display:block;font-family:KaiTi,serif;font-size:calc(14 * var(--u));white-space:nowrap}.target small{display:block;font-size:calc(9 * var(--u));color:#71806b;margin-top:calc(3 * var(--u))}.target:disabled{color:#9b9c88;background:#ede9dc}.target:disabled small{color:#9b9c88}.text-button{border:0;background:none;padding:0;color:#8a7237;font-size:calc(10 * var(--u));min-height:calc(22 * var(--u))}.logs{padding-top:calc(6 * var(--u));padding-bottom:calc(6 * var(--u))}.logs .heading{margin-bottom:calc(3 * var(--u))}.log-row{display:flex;gap:calc(6 * var(--u));line-height:1.65;font-size:calc(10 * var(--u));color:#4a6252}.log-row time{color:#96927a;white-space:nowrap}.log-row b{font-weight:500;color:#a97829}.nav{display:grid;grid-template-columns:repeat(7,1fr);border:2px solid #cead59;background:#003d31;color:#f5eac5;border-radius:6px;padding:calc(5 * var(--u)) 0;flex-shrink:0}.nav button{background:none;border:0;border-right:1px solid #c6bd7b50;color:inherit;font-size:calc(10 * var(--u));padding:calc(3 * var(--u)) 0}.nav i{display:block;font-style:normal;font-size:calc(19 * var(--u));margin-bottom:2px}.nav button.active{color:#ffe08a}.nav button:last-child{border:0}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:#002b29a8;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);z-index:8}.sheet{width:min(100%,750px);background:#f8f3e5;padding:calc(15 * var(--u,1px));border:1px solid #c2a465;border-radius:14px 14px 0 0;max-height:75dvh;overflow:auto}.sheet h2{font-family:KaiTi,serif;font-size:22px;margin:0}.sheet p{font-size:14px;line-height:1.8}.sheet button{border:1px solid #b5a26d;border-radius:5px;background:#064737;color:#fff3cd;padding:10px 18px}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-top button{background:transparent;color:#28513f}.all-targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.all-targets .target{padding:12px}.all-targets .target strong{font-size:18px}.all-targets .target small{font-size:12px}.design-note{font-size:calc(9 * var(--u));color:#8e815e;margin:0;text-align:center}
.target small{font-size:calc(11 * var(--u))}.log-row{font-size:calc(12 * var(--u))}.targets{flex:1;grid-template-rows:repeat(2,minmax(calc(42 * var(--u)),1fr))}.battle-foot,.meter-title,.stats{font-size:calc(11 * var(--u))}
:root{--u:min(.2666667vw,2px)}.sheet h2{font-size:calc(20 * var(--u))}.sheet p{font-size:calc(14 * var(--u))}.sheet button{font-size:calc(12 * var(--u));padding:calc(8 * var(--u)) calc(14 * var(--u));min-height:calc(36 * var(--u))}.all-targets .target strong{font-size:calc(15 * var(--u))}.all-targets .target small{font-size:calc(12 * var(--u))}

.enemy-name-row{display:flex;align-items:center;gap:calc(8 * var(--u));flex-wrap:wrap}.enemy-name-row h1{margin:0}.switch-target{min-height:calc(30 * var(--u));padding:calc(4 * var(--u)) calc(9 * var(--u));border:1px solid #b5a16a;border-radius:5px;background:#f5f0dc;color:#42624e;font-size:calc(12 * var(--u))}.enemy-copy small{display:block;margin-top:calc(4 * var(--u))}.battle{padding:calc(13 * var(--u));}.enemy-head{margin-bottom:calc(13 * var(--u))}.combat-meters{grid-template-columns:1fr;gap:calc(11 * var(--u))}.meter-title{font-size:calc(13 * var(--u))}.meter{height:calc(8 * var(--u));margin-top:calc(5 * var(--u))}.battle-notes{display:flex;align-items:center;flex-wrap:wrap;gap:calc(6 * var(--u));margin-top:calc(13 * var(--u));padding-top:calc(9 * var(--u));border-top:1px solid #d5cdb4;font-size:calc(11 * var(--u));color:#66715d}.battle-notes strong{font-weight:500;color:#22543f;background:#e3e8d5;padding:2px 6px;border-radius:4px}.battle-notes small{display:block;width:100%;font-size:calc(11 * var(--u));line-height:1.6}.battle-foot{font-size:calc(12 * var(--u));margin-top:calc(9 * var(--u))}.fight{min-height:calc(39 * var(--u));margin-top:calc(11 * var(--u))}.logs{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(10 * var(--u))}.logs .heading{font-size:calc(14 * var(--u));margin-bottom:calc(5 * var(--u))}#recentLogs{overflow:auto;min-height:0;flex:1}.log-row{padding:calc(5 * var(--u)) 0;border-bottom:1px dashed #ded5be;font-size:calc(12 * var(--u));line-height:1.65}.log-row:last-child{border:0}.logs .text-button{font-size:calc(12 * var(--u))}.all-targets .target{min-height:calc(55 * var(--u))}.sheet{--u:min(.2666667vw,2px)}
.battle{padding:calc(10 * var(--u))}.enemy-head{margin-bottom:calc(9 * var(--u))}.combat-meters{gap:calc(8 * var(--u))}.battle-notes{display:block;margin-top:calc(8 * var(--u));padding-top:calc(6 * var(--u));line-height:1.5}.fight{margin-top:calc(8 * var(--u))}
</style></head><body><div class="phone">
<header class="top"><div class="identity"><div class="avatar"></div><div class="realm">炼气二境<small>12 年 6 月 · 角色信息示例</small></div><span class="preview-tag">交互设计预览</span></div><div class="stats"><span>攻击 <b>245</b></span><span>防御 <b>122</b></span><span>寿元 <b>26 / 161 年</b></span><span>灵石 <b id="stones">3,500</b></span></div></header>
<div class="quest"><span>▸ 主线 · 初战野猪</span><span id="questProgress">2 / 5　›</span></div>
<main class="main"><div class="regions"><button class="region active">凡界</button><button class="region locked">灵界 · 未开启</button><button class="region locked">仙界 · 未开启</button></div>
<section class="panel battle"><div class="enemy-head"><div class="beast" id="beastMark">豕</div><div class="enemy-copy"><div class="enemy-name-row"><h1 id="enemyName">乌鬃野猪</h1><button class="switch-target" id="switchTarget">切换 ⇄</button></div><small id="enemyStats">未进化 · 攻击 18 · 防御 8</small></div><span class="status" id="battleStatus">待出发</span></div><div class="combat-meters"><div><div class="meter-title"><span>妖兽气血</span><span id="enemyHp">580 / 580</span></div><div class="meter"><div class="fill enemy-fill" id="enemyFill"></div></div></div><div><div class="meter-title"><span>自身气血</span><span>7,976 / 7,976</span></div><div class="meter"><div class="fill"></div></div></div></div><div class="battle-notes">自动续战 · 战胜后继续挑战，直至停止或战败</div><div class="battle-foot"><span>进化 <b id="evolution">2 / 100</b></span><span>可得 <b id="drops">凡核、兽魂</b></span></div><button class="fight" id="fight">开始历练</button></section>

<section class="panel logs"><div class="heading">历练见闻<span><button class="text-button" id="moreLogs">全部记录 ›</button></span></div><div id="recentLogs"><div class="log-row"><time>刚刚</time><span>战胜乌鬃野猪，获得 <b>下品凡核 ×1</b></span></div><div class="log-row"><time>片刻前</time><span>发现妖兽 <b>青鳞蛇</b></span></div></div></section>
<p class="design-note">示例数据 · 点击名字旁的“切换”选择妖兽</p></main>
<nav class="nav"><button><i>☼</i>修炼</button><button><i>♧</i>境界</button><button><i>♙</i>人物</button><button class="active"><i>⚔</i>历练</button><button><i>♧</i>纳戒</button><button><i>▤</i>功法</button><button><i>⚙</i>设置</button></nav></div>
<div class="overlay" id="overlay" hidden><section class="sheet"><div class="sheet-top"><h2 id="sheetTitle"></h2><button id="close">收起</button></div><div id="sheetBody"></div></section></div>
<script>
const enemies=[{name:'乌鬃野猪',mark:'豕',hp:580,atk:18,def:8,drop:'凡核、兽魂'},{name:'青鳞蛇',mark:'蛇',hp:960,atk:26,def:12,drop:'凡核、兽魂'},{name:'赤目狼',mark:'狼',hp:1480,atk:38,def:18,drop:'凡核、兽魂'},{name:'铁背熊',mark:'熊',hp:2400,atk:56,def:30,drop:'凡核、兽魂'}];let selected=0,running=false,hp=580,kills=2;const history=['战胜乌鬃野猪，获得下品凡核 ×1','发现妖兽青鳞蛇','战胜乌鬃野猪，获得灵石 ×12','乌鬃野猪进化进度增加','进入凡界，开始云游历练'];const $=id=>document.getElementById(id);
function targetButtons(all=false){return [...enemies,...Array.from({length:all?8:2},(_,i)=>({name:'未发现',locked:true}))].map((e,i)=>`<button class="target ${i===selected?'selected':''}" data-enemy="${i}" ${e.locked?'disabled':''}><strong>${e.locked?'◇ ':''}${e.name}</strong><small>${e.locked?'继续历练发现':'未进化 · '+(i===selected?'当前目标':'可挑战')}</small></button>`).join('')}
function render(){const e=enemies[selected];$('enemyName').textContent=e.name;$('beastMark').textContent=e.mark;$('enemyStats').textContent='未进化 · 攻击 '+e.atk+' · 防御 '+e.def;$('drops').textContent=e.drop;$('enemyHp').textContent=Math.ceil(hp)+' / '+e.hp;$('enemyFill').style.width=hp/e.hp*100+'%';$('battleStatus').textContent=running?'历练中 · 自动续战':'待出发';$('fight').textContent=running?'停止历练':'开始历练';$('fight').classList.toggle('running',running);$('evolution').textContent=kills+' / 100';}
function open(title,body){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=body;$('overlay').hidden=false;}
document.addEventListener('click',event=>{const t=event.target.closest('[data-enemy]');if(!t)return;const next=Number(t.dataset.enemy);if(running){open('切换历练目标',`<p>正在挑战${enemies[selected].name}。切换将结束当前战斗，并选择${enemies[next].name}。</p><button data-confirm-target="${next}">停止并切换目标</button>`);return;}selected=next;hp=enemies[next].hp;$('overlay').hidden=true;render();});
document.addEventListener('click',event=>{const t=event.target.closest('[data-confirm-target]');if(t){running=false;selected=Number(t.dataset.confirmTarget);hp=enemies[selected].hp;$('overlay').hidden=true;render();}});
$('fight').onclick=()=>{running=!running;render();};$('switchTarget').onclick=()=>open('切换历练目标 · 4 / 12 已发现','<div class="all-targets">'+targetButtons(true)+'</div>');$('moreLogs').onclick=()=>open('历练见闻','<p>'+history.map(s=>'• '+s).join('</p><p>')+'</p><p style="color:#887c60">此处仅展示交互方案，未连接实际游戏。</p>');$('close').onclick=()=>$('overlay').hidden=true;$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').hidden=true;};document.querySelectorAll('.region.locked').forEach(b=>b.onclick=()=>open('此界尚未开启','<p>正式版将在这里显示原游戏的境界要求。当前是界面预览。</p>'));
function renderLogs(){ $('recentLogs').innerHTML=history.slice(0,5).map((entry,i)=>'<div class="log-row"><time>'+(['刚刚','片刻前','更早'][Math.min(i,2)])+'</time><span>'+entry+'</span></div>').join(''); }
setInterval(()=>{if(!running)return;hp=Math.max(0,hp-enemies[selected].hp*.24);if(hp<=0){kills++;const entry='战胜'+enemies[selected].name+'，获得下品凡核 ×1';history.unshift(entry);renderLogs();hp=enemies[selected].hp;}render();},1000);render();renderLogs();
</script></body></html>
