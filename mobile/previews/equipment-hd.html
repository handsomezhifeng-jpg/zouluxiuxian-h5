<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装备图鉴 · 384款高清装备</title>
<style>body{margin:0;background:#f7efdf;color:#433321;font:18px/1.4 KaiTi,STKaiti,serif}main{max-width:1200px;margin:auto;padding:25px}header{display:flex;gap:20px;align-items:center;border-bottom:1px solid #b69557;padding:0 0 16px;flex-wrap:wrap}h1{font-size:28px;font-weight:400;margin:0}select,button{font:inherit;color:inherit;background:#fff9ec;border:1px solid #bda26d;border-radius:5px;padding:8px 15px}header small{margin-left:auto;color:#7f6c50}h2{font-size:23px;font-weight:400;margin:25px 0 10px}section{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:15px}article{border:1px solid color-mix(in srgb,var(--q) 55%,#d1bb91);padding:8px;text-align:center;background:radial-gradient(ellipse at 50% 65%,color-mix(in srgb,var(--q) 10%,transparent),transparent 70%);border-radius:9px;min-width:0}article button{display:block;border:0;background:none;padding:0;width:100%;cursor:zoom-in}article img{width:100%;aspect-ratio:1;object-fit:contain;display:block}article strong{display:block;font-weight:400;font-size:19px}article small{display:block;color:var(--q);font-size:15px;margin-top:4px}dialog{border:1px solid #af8d4b;border-radius:12px;background:#faf1df;color:#433321;width:min(85vw,650px);padding:20px}dialog::backdrop{background:#16201ab9;backdrop-filter:blur(4px)}dialog img{width:100%;height:min(65vh,600px);object-fit:contain}dialog header{justify-content:space-between}@media(max-width:700px){main{padding:14px}section{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}article strong{font-size:16px}header small{margin:0}}</style>
<main><header><h1>装备图鉴</h1><select aria-label="选择境界" id="realm"></select><small>16境界 · 4部位 · 6品质 · 384款独立PNG</small></header><div id="book"></div></main><dialog><header><span id="title"></span><button id="close">关闭</button></header><img id="large" alt=""></dialog>
<script src="/ui/equipment-atlas.js"></script><script src="/ui/equipment-rolls.js"></script><script>
const A=MobileEquipmentAtlas,R=MobileEquipmentRolls,select=document.querySelector('#realm'),book=document.querySelector('#book'),dialog=document.querySelector('dialog');select.innerHTML=A.realms.map(r=>`<option value="${r.id}">${r.realm}</option>`).join('');function render(){const r=A.realms[Number(select.value)];book.innerHTML=['sword','robe','jade','boots'].map((slot,n)=>`<h2>${['武器','法衣','配饰','鞋履'][n]}</h2><section>${r.variants.filter(i=>i.slot===slot).map(i=>`<article style="--q:${R.qualities[i.variantQuality].textColor}"><button data-id="${i.id}" aria-label="查看${i.name}高清图"><img src="${A.base+i.iconFile}" alt="${i.name}"></button><strong>${i.name}</strong><small>${R.qualities[i.variantQuality].name}</small></article>`).join('')}</section>`).join('')}select.onchange=render;book.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const i=A.definitions.find(i=>i.id===b.dataset.id);document.querySelector('#title').textContent=i.name+' · '+R.qualities[i.variantQuality].name;const image=document.querySelector('#large');image.src=A.base+i.iconFile;image.alt=i.name;dialog.showModal()};document.querySelector('#close').onclick=()=>dialog.close();render();
</script></html>
