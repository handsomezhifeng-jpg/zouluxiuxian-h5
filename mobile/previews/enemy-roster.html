<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>前十种妖兽 · 图片与动作</title><style>
*{box-sizing:border-box}body{margin:0;background:#102236;color:#d9e7f2;font-family:'Microsoft YaHei',sans-serif;padding:24px}h1{font-size:22px;font-weight:500}p{color:#a6bfd0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:#193247;border:1px solid #67869b40;border-radius:8px;padding:16px;text-align:center}.sprite{width:180px;height:180px;max-width:100%;margin:auto;background-repeat:no-repeat;background-position:0 0}.card h2{font-size:16px;font-weight:400;margin:10px}.card button{background:#355d78;color:#e4f0f8;border:1px solid #759bb5;border-radius:5px;padding:8px 22px;cursor:pointer}small{display:block;color:#95b2c8;margin-top:10px;font-size:11px}
</style><h1>前十种妖兽 · 图片与攻击动作</h1><p>点击播放：待机 → 蓄势 → 出击 → 收势。此预览不读取或修改游戏存档。</p><main class="grid"></main><script src="mobile/enemy-art.js"></script><script>
const base='mobile/assets/combat/';
document.querySelector('main').innerHTML=Object.values(MobileEnemyArt).map(e=>`<section class="card"><div class="sprite" style="background-image:url('${base+e.sheet}');background-size:${e.frames*100}% 100%" data-id="${e.id}"></div><h2>${e.id}. ${e.name}</h2><button data-play="${e.id}">播放攻击</button><small>${e.frames} 个绘制姿态 · 透明底</small></section>`).join('');
document.addEventListener('click',e=>{const button=e.target.closest('[data-play]');if(!button)return;const entry=MobileEnemyArt[button.dataset.play],sprite=document.querySelector(`[data-id="${entry.id}"]`);sprite.getAnimations().forEach(a=>a.cancel());const offsets=entry.frames===4?[0,.18,.46,.75]:Array.from({length:entry.frames},(_,i)=>i/entry.frames);sprite.animate([...offsets.map((offset,i)=>({backgroundPosition:`${i/(entry.frames-1)*100}% 0`,offset,easing:'steps(1,end)'})),{backgroundPosition:'0% 0',offset:1}],{duration:650});});
</script></html>
